<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in or create your ILEWA account to shop beauty products, track orders, and earn loyalty rewards." />
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:title" content="ILEWA | Account" />
  <meta property="og:description" content="Sign in or create your ILEWA account to shop beauty products, track orders, and earn loyalty rewards." />
  <meta property="og:type" content="website" />
  <title>Ilewa | Account</title>

  <link href="https://fonts.googleapis.com/css2?family=Ojuju:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="dashboard-header">
    <div class="logo-container">
      <a href="index.html" class="logo-text">ILEWA</a>
    </div>
    <div class="user-profile">
      <div class="user-icons-group">
        <a href="#" id="openCartBtn" class="icon" title="Cart">
          <i class="fas fa-shopping-bag"></i>
        </a>
        <a href="auth.html" class="icon" title="Profile">
          <i class="fas fa-user-circle user-icon"></i>
        </a>
      </div>
    </div>
  </header>

  <main class="auth-page-container" id="main-content">
    <div class="auth-box">
      <div class="auth-tabs" role="tablist" aria-label="Account options">
        <button class="auth-tab active" id="loginTab" role="tab" aria-selected="true" aria-controls="loginForm">LOG IN</button>
        <button class="auth-tab" id="signupTab" role="tab" aria-selected="false" aria-controls="signupForm">SIGN UP</button>
      </div>

      <!-- Login Form -->
      <div id="loginForm" class="auth-form active" role="tabpanel" aria-labelledby="loginTab">
        <h1 style="font-size:1.5rem;">Welcome Back</h1>
        <form id="loginFormEl" novalidate>
          <label for="loginEmail" class="form-label">Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
          <label for="loginPassword" class="form-label">Password</label>
          <input type="password" id="loginPassword" placeholder="Your password" required autocomplete="current-password" minlength="6">
          <button type="submit" class="auth-btn">Log In</button>
          <a href="#" class="forgot-link">Forgot Password?</a>
          <p class="note" style="color:gray; margin-top:8px;">Brand founders: log in with credentials provided by Ilewa.</p>
        </form>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" class="auth-form" role="tabpanel" aria-labelledby="signupTab" hidden>
        <h1 style="font-size:1.5rem;">Create Your Account</h1>
        <form id="signupFormEl" novalidate>
          <label for="signupName" class="form-label">Full Name <span style="font-weight:300;">(Optional)</span></label>
          <input type="text" id="signupName" placeholder="Jane Doe" autocomplete="name">
          <label for="signupEmail" class="form-label">Email Address</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
          <label for="signupPassword" class="form-label">Password <span style="font-weight:300;">(Min 6 characters)</span></label>
          <input type="password" id="signupPassword" placeholder="Create a password" required autocomplete="new-password" minlength="6">
          <button type="submit" class="auth-btn">Sign Up</button>
          <p class="terms-text">By signing up, you agree to our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.</p>
        </form>
      </div>
    </div>
  </main>

  <footer class="ilewa-footer">
    <div class="footer-content">
      <h3 class="footer-title">Connect with Us. Stay Updated.</h3>
      <button class="join-waitlist-btn">JOIN THE WAITLIST</button>
      <div class="social-icons">
        <i class="fas fa-envelope"></i>
        <i class="fab fa-linkedin-in"></i>
        <i class="fab fa-instagram"></i>
        <i class="fab fa-tiktok"></i>
      </div>
      <p class="copyright">&copy; 2025 Ilewa. All rights reserved.</p>
    </div>
  </footer>

  <script>
    function showTab(activeTab, hiddenTab, activePanel, hiddenPanel) {
      document.getElementById(activePanel).classList.add('active');
      document.getElementById(activePanel).removeAttribute('hidden');
      document.getElementById(hiddenPanel).classList.remove('active');
      document.getElementById(hiddenPanel).setAttribute('hidden', '');
      document.getElementById(activeTab).classList.add('active');
      document.getElementById(activeTab).setAttribute('aria-selected', 'true');
      document.getElementById(hiddenTab).classList.remove('active');
      document.getElementById(hiddenTab).setAttribute('aria-selected', 'false');
    }

    document.getElementById('loginTab').addEventListener('click', () => {
      showTab('loginTab', 'signupTab', 'loginForm', 'signupForm');
    });

    document.getElementById('signupTab').addEventListener('click', () => {
      showTab('signupTab', 'loginTab', 'signupForm', 'loginForm');
    });
  </script>

  <script type="module">
    import { supabase } from "./shared-supabase.js";

    // === SIGNUP HANDLER (Consumers only) ===
    document.getElementById("signupFormEl").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;
      const fullName = document.getElementById("signupName").value;

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) {
        alert("Signup failed: " + error.message);
        return;
      }

      // Add profile record
      const { error: insertError } = await supabase
        .from("profiles")
        .insert([{ id: data.user.id, full_name: fullName || "ILEWA Member", role: "consumer" }]);

      if (insertError) {
        console.error("Profile insert error:", insertError);
        alert("Profile could not be created. Try again later.");
        return;
      }

      alert("Signup successful! You can now log in.");
      window.location.href = "auth.html";
    });

    // === LOGIN HANDLER ===
    document.getElementById("loginFormEl").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert("Login failed: " + error.message);
        return;
      }

      const user = data.user;
      const { data: profile, error: profileError } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();

      if (profileError) {
        console.error("Profile fetch error:", profileError);
        alert("Login successful, but profile not found.");
        return;
      }

      if (profile?.role === "brand") {
        window.location.href = "brand-dashboard.html";
      } else {
        window.location.href = "consumer-dashboard.html";
      }
    });
  </script>
</body>
</html>
