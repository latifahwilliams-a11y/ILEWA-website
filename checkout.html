
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ilewa | Checkout</title>
  <link href="https://fonts.googleapis.com/css2?family=Ojuju:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="checkout.css" />
  <script src="product.js" defer></script>
  <script src="script.js" defer></script>
  <script src="checkout.js" defer></script>
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">ILEWA</a>
    </div>
    <div class="nav-right">
      <a href="shop.html" class="icon" title="Back to shop"><i class="fas fa-store"></i></a>
    </div>
  </header>

  <main class="checkout-wrapper">
    <h1>Checkout</h1>
    <div class="checkout-grid">
      <section>
        <h2>Your Cart</h2>
        <div id="checkoutItems"></div>
      </section>
      <aside>
        <div class="summary">
          <div class="row"><span>Subtotal</span><span id="sumSubtotal">$0.00</span></div>
          <div class="row"><span>Shipping</span><span>Calculated at next step</span></div>
          <div class="row total"><span>Total</span><span id="sumTotal">$0.00</span></div>
          <button id="proceedBtn" class="button-cta" style="width:100%;">Continue</button>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
