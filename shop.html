<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ilewa | Shop All Products</title>
  <meta name="description" content="Shop ILEWA's full beauty collection — hair care, skincare, body care, makeup, and fragrance. All products crafted for you." />
  <meta property="og:title" content="ILEWA | Shop All Products" />
  <meta property="og:description" content="Explore ILEWA's curated beauty collection. Hair, skincare, body, makeup, and fragrance — all in one place." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="apple-touch-icon.png" />

  <link href="https://fonts.googleapis.com/css2?family=Ojuju:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <link rel="stylesheet" href="style.css" /> 
  <link rel="stylesheet" href="shop.css" /> 

  <link rel="stylesheet" href="product.css" /> 

<!-- Always load product data before rendering -->
<script src="product.js" defer></script>

<!-- Cart + global logic -->
<script src="script.js" defer></script>

<!-- Shop logic that renders products using const products -->
<script src="shop.js" defer></script>

</head>

<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="navbar" role="banner">
    <div class="nav-left">
      <a href="index.html" class="logo" aria-label="ILEWA home">ILEWA</a>
    </div>
    <div class="nav-right">
      <a href="auth.html" class="icon" aria-label="My account">
        <i class="fas fa-user-circle" aria-hidden="true"></i>
      </a>
      <button id="openCartBtn" class="icon cart-icon" aria-label="Open shopping bag" aria-expanded="false" aria-controls="cartDrawer" style="background:none;border:none;cursor:pointer;padding:0;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 7h12l1 13H5L6 7z" />
          <path d="M9 7a3 3 0 0 1 6 0" />
        </svg>
      </button>
    </div>
  </header>

  <nav class="category-nav-bar" aria-label="Product categories">
    <div class="category-links-container">
        <a href="shop.html?category=all" data-category="all" class="category-link">ALL</a>
        <a href="shop.html?category=hair" data-category="hair" class="category-link">HAIR</a>
        <a href="shop.html?category=skincare" data-category="skincare" class="category-link">SKINCARE</a>
        <a href="shop.html?category=body" data-category="body" class="category-link">BODY</a>
        <a href="shop.html?category=makeup" data-category="makeup" class="category-link">MAKEUP</a>
        <a href="shop.html?category=fragrance" data-category="fragrance" class="category-link">FRAGRANCE</a>
    </div>
  </nav>

  <main class="shop-page-wrapper" id="main-content">
    <h1 id="pageTitle">Shop All Products</h1>

    <div id="allProductGrid" class="product-grid" role="list" aria-label="Products">
    </div>
  </main>

  <div id="cartDrawer" class="cart-drawer" role="dialog" aria-modal="true" aria-label="Shopping bag">
    <div class="cart-header">
        <h2>Your Bag</h2>
        <button id="closeCartBtn" class="close-btn" aria-label="Close shopping bag"><i class="fas fa-times" aria-hidden="true"></i></button>
    </div>
    <div id="cartItems" class="cart-items">
      <p class="empty-cart">Your bag is currently empty.</p>
    </div>

    <div class="cart-footer">
      <div class="subtotal">
        <p>Subtotal</p>
        <p id="cartSubtotal">$0.00</p>
      </div>
      <button id="checkoutBtn" class="checkout-btn">Checkout</button>
    </div>
  </div>
  <div id="cartBackdrop" class="cart-backdrop" aria-hidden="true"></div>
    

  <footer>
    <div class="footer-wrapper">
        <div class="footer-content">
            <div class="footer-title">Connect with Us. Stay Updated.</div>
            <div class="footer-waitlist-cta">
                <a href="index.html#cta" class="button-cta">JOIN THE WAITLIST</a>
            </div>
            <nav aria-label="Footer navigation" style="margin: 16px 0;">
                <a href="about.html" style="color:white;margin:0 12px;font-size:0.9rem;">About</a>
                <a href="contact.html" style="color:white;margin:0 12px;font-size:0.9rem;">Contact</a>
                <a href="privacy.html" style="color:white;margin:0 12px;font-size:0.9rem;">Privacy Policy</a>
                <a href="terms.html" style="color:white;margin:0 12px;font-size:0.9rem;">Terms</a>
            </nav>
            <div class="social-links">
                <a href="https://ilewaworld.substack.com/" aria-label="Follow us on Substack"><i class="fas fa-envelope" aria-hidden="true"></i></a>
                <a href="#" aria-label="Connect with us on LinkedIn"><i class="fab fa-linkedin-in" aria-hidden="true"></i></a>
                <a href="https://www.instagram.com/ilewa.world" aria-label="Follow us on Instagram"><i class="fab fa-instagram" aria-hidden="true"></i></a>
                <a href="https://www.tiktok.com/@ilewa.world" aria-label="Follow us on TikTok"><i class="fab fa-tiktok" aria-hidden="true"></i></a>
            </div>
            <p class="footer-copyright">&copy; 2025 Ilewa World, Inc. All Rights Reserved.</p>
        </div>
    </div>
  </footer>
</body>
</html>
