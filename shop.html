<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ilewa | Shop All Products</title>

  <link href="https://fonts.googleapis.com/css2?family=Ojuju:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <link rel="stylesheet" href="style.css" /> 
  <link rel="stylesheet" href="shop.css" /> 

  <link rel="stylesheet" href="product.css" /> 

<!-- Always load product data before rendering -->
<script src="product.js" defer></script>

<!-- Cart + global logic -->
<script src="script.js" defer></script>

<!-- Shop logic that renders products using const products -->
<script src="shop.js" defer></script>

</head>

<body>
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">ILEWA</a>
    </div>

 
    <div class="nav-right">
      <a href="auth.html" class="icon" title="Profile">
        <i class="fas fa-user-circle"></i> 
      </a>
      <a href="#cart" id="openCartBtn" class="icon" title="Shopping Bag">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M6 7h12l1 13H5L6 7z" />
          <path d="M9 7a3 3 0 0 1 6 0" />
        </svg>
      </a>
    </div>
  </header>
  
  <nav class="category-nav-bar">
    <div class="category-links-container">
        <a href="shop.html?category=all" data-category="all" class="category-link">ALL</a>
        <a href="shop.html?category=hair" data-category="hair" class="category-link">HAIR</a>
        <a href="shop.html?category=skincare" data-category="skincare" class="category-link">SKINCARE</a>
        <a href="shop.html?category=body" data-category="body" class="category-link">BODY</a>
        <a href="shop.html?category=makeup" data-category="makeup" class="category-link">MAKEUP</a>
        <a href="shop.html?category=fragrance" data-category="fragrance" class="category-link">FRAGRANCE</a>
    </div>
  </nav>

  <main class="shop-page-wrapper">
    <h1 id="pageTitle">Shop All Products</h1>

    <div id="allProductGrid" class="product-grid">
      </div>
  </main>
  <div id="cartDrawer" class="cart-drawer">
    <div class="cart-header">
        <h2>Your Bag</h2>
        <button id="closeCartBtn" class="close-btn"><i class="fas fa-times"></i></button>
    </div>
    <div id="cartItems" class="cart-items">
      <p class="empty-cart">Your bag is currently empty.</p>
    </div>

    <div class="cart-footer">
      <div class="subtotal">
        <p>Subtotal</p>
        <p id="cartSubtotal">$0.00</p>
      </div>
      <button id="checkoutBtn" class="checkout-btn">Checkout</button>
    </div>
  </div>
  <div id="cartBackdrop" class="cart-backdrop"></div>
    

  <footer>
    <div class="footer-wrapper">
        <div class="wavy-border"></div>
        <div class="footer-content">
            <div class="footer-title">Connect with Us. Stay Updated.</div>
            <div class="footer-waitlist-cta">
                <a href="#cta" class="button-cta">JOIN THE WAITLIST</a>
            </div>
            <div class="social-links">
                <a href="https://ilewaworld.substack.com/" aria-label="Follow us on Substack"><i class="fas fa-envelope"></i></a>
                <a href="#" aria-label="Connect with us on LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://www.instagram.com/ilewa.world" aria-label="Follow us on Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.tiktok.com/@ilewa.world?_t=8hI9eO9r7x7&_r=1" aria-label="Follow us on TikTok"><i class="fab fa-tiktok"></i></a>
            </div>
            <p class="footer-copyright">&copy; 2025 Ilewa World, Inc. All Rights Reserved.</p>
        </div>
    </div>
  </footer>
</body>
</html>
